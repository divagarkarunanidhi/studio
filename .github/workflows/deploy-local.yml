name: Deploy to Local Machine

on:
  push:
    branches: [mongo]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Node.js version
        run: |
          "C:\Program Files\nodejs\node.exe" -v
          "C:\Program Files\nodejs\npm.cmd" -v

      - name: Copy env file
        shell: powershell
        run: |
          if (-not (Test-Path "${{ github.workspace }}\.env.local")) {
            if (Test-Path "${{ github.workspace }}\.env.local.deploy") {
              Copy-Item "${{ github.workspace }}\.env.local.deploy" "${{ github.workspace }}\.env.local"
            } else {
              Write-Warning ".env.local not found - app may fail at runtime"
            }
          }

      - name: Install dependencies
        run: "C:\Program Files\nodejs\npm.cmd" ci

      - name: Build application
        run: "C:\Program Files\nodejs\npx.cmd" next build
        env:
          NODE_ENV: production

      - name: Install PM2 globally
        run: "C:\Program Files\nodejs\npm.cmd" list -g pm2 || "C:\Program Files\nodejs\npm.cmd" install -g pm2

      - name: Stop existing app (if running)
        run: npx pm2 stop ecosystem.config.cjs || echo "No existing process to stop"

      - name: Start application with PM2
        run: npx pm2 start ecosystem.config.cjs --env production

      - name: Save PM2 process list
        run: npx pm2 save

      - name: Show deployment status
        run: npx pm2 list
