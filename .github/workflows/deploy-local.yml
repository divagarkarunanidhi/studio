name: Deploy to Local Machine

on:
  push:
    branches: [mongo]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Node.js version
        run: |
          "C:\Program Files\nodejs\node.exe" -v
          "C:\Program Files\nodejs\npm.cmd" -v

      - name: Copy env file
        continue-on-error: true
        run: |
          if not exist ".env.local" (
            if exist "C:\Code base\bugsense apr 24\studio\.env.local" (
              copy "C:\Code base\bugsense apr 24\studio\.env.local" ".env.local"
              echo Copied .env.local from project root
            ) else (
              echo WARNING: .env.local not found - app may fail at runtime
            )
          ) else (
            echo .env.local already exists
          )

      - name: Install dependencies
        run: |
          "C:\Program Files\nodejs\npm.cmd" ci

      - name: Build application
        run: |
          "C:\Program Files\nodejs\npx.cmd" next build
        env:
          NODE_ENV: production

      - name: Install PM2 globally
        run: |
          "C:\Program Files\nodejs\npm.cmd" list -g pm2 || "C:\Program Files\nodejs\npm.cmd" install -g pm2

      - name: Stop existing app (if running)
        run: |
          "C:\Program Files\nodejs\npx.cmd" pm2 stop ecosystem.config.cjs || echo "No existing process to stop"

      - name: Start application with PM2
        run: |
          "C:\Program Files\nodejs\npx.cmd" pm2 start ecosystem.config.cjs --env production

      - name: Save PM2 process list
        run: |
          "C:\Program Files\nodejs\npx.cmd" pm2 save

      - name: Show deployment status
        run: |
          "C:\Program Files\nodejs\npx.cmd" pm2 list
